services:
  - type: web
    name: rfms-backend
    env: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      - key: COOKIE_SECURE
        value: "true"
